version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # Signature : variables d'environnement lues par build/windows/sign.ps1 et
  # build/windows/msix/build-msix.ps1 (voir docs/release/signature.md) :
  #   WINDOWS_CERT_PATH + WINDOWS_CERT_PASSWORD  certificat .pfx
  #   WINDOWS_CERT_THUMBPRINT                    ou certificat du magasin (jeton EV)
  #   WINDOWS_TIMESTAMP_URL                      horodatage (DigiCert par défaut)
  #   WINDOWS_PUBLISHER                          éditeur MSIX sans .pfx (Trusted Signing)

  # Docker image for cross-compilation with CGO (used when CGO_ENABLED=1 on non-Windows)
  CROSS_IMAGE: wails-cross

tasks:
  build:
    summary: Builds the application for Windows
    cmds:
      # Auto-detect CGO: if CGO_ENABLED=1, use Docker; otherwise use native Go cross-compile
      - task: '{{if and (ne OS "windows") (eq .CGO_ENABLED "1")}}build:docker{{else}}build:native{{end}}'
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
    vars:
      # Default to CGO_ENABLED=0 if not explicitly set
      CGO_ENABLED: '{{.CGO_ENABLED | default "0"}}'

  build:native:
    summary: Builds the application using native Go cross-compilation
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: "garble is required for obfuscated builds. Install it with: go install mvdan.cc/garble@v0.16.0 (requires Go 1.24+). See https://github.com/burrowers/garble/releases for version/toolchain compatibility."
    cmds:
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH}}'
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe"'
      - cmd: powershell Remove-item *.syso
        platforms: [windows]
      - cmd: rm -f *.syso
        platforms: [linux, darwin]
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if or .EXTRA_TAGS (eq .OBFUSCATED "true")}}-tags {{if eq .OBFUSCATED "true"}}wails_obfuscated{{if .EXTRA_TAGS}},{{end}}{{end}}{{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui"{{end}}'
    env:
      GOOS: windows
      CGO_ENABLED: '{{.CGO_ENABLED | default "0"}}'
      GOARCH: '{{.ARCH | default ARCH}}'

  build:docker:
    summary: Cross-compiles for Windows using Docker with Zig (for CGO builds on non-Windows)
    internal: true
    deps:
      - task: common:build:frontend
        vars:
          OBFUSCATED:
            ref: .OBFUSCATED
      - task: common:generate:icons
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required for CGO cross-compilation. Please install Docker."
      - sh: docker image inspect {{.CROSS_IMAGE}} > /dev/null 2>&1
        msg: |
          Docker image '{{.CROSS_IMAGE}}' not found.
          Build it first: wails3 task setup:docker
    cmds:
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH}}'
      - docker run --rm -v "{{.ROOT_DIR}}:/app" {{.DOCKER_MOUNTS}} -e APP_NAME="{{.APP_NAME}}" {{if .EXTRA_TAGS}}-e EXTRA_TAGS="{{.EXTRA_TAGS}}"{{end}} {{if eq .OBFUSCATED "true"}}-e OBFUSCATED=true{{end}} {{if .GARBLE_ARGS}}-e GARBLE_ARGS="{{.GARBLE_ARGS}}"{{end}} {{.CROSS_IMAGE}} windows {{.DOCKER_ARCH}}
      - cmd: docker run --rm -v "{{.ROOT_DIR}}:/app" alpine chown -R $(id -u):$(id -g) /app/bin
        platforms: [linux, darwin]
      - rm -f *.syso
    vars:
      DOCKER_ARCH: '{{.ARCH | default "amd64"}}'
      # Generate Docker volume mounts: Go module cache + go.mod replace directives
      # Uses wails3 tool docker-mounts for cross-platform compatibility (Windows/Linux/macOS)
      DOCKER_MOUNTS:
        sh: 'wails3 tool docker-mounts'

  package:
    summary: Packages the application
    cmds:
      - task: '{{if eq (.FORMAT | default "nsis") "msix"}}create:msix:package{{else}}create:nsis:installer{{end}}'
        vars:
          INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'
    vars:
      FORMAT: '{{.FORMAT | default "nsis"}}'
      INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'

  generate:syso:
    summary: Generates Windows `.syso` file
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  create:nsis:installer:
    summary: Creates an NSIS installer
    deps:
      - task: build
    cmds:
      - task: package:nsis
        vars:
          ARCH: '{{.ARCH}}'
          INSTALL_SCOPE: '{{.INSTALL_SCOPE}}'
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'

  # Installeur NSIS à partir de bin/lattis.exe tel qu'il est (sans le
  # reconstruire : release le signe avant). Avec un certificat
  # (WINDOWS_CERT_PATH ou WINDOWS_CERT_THUMBPRINT), makensis signe
  # l'installeur et le désinstalleur par build/windows/sign.ps1.
  package:nsis:
    summary: Creates the NSIS installer from the existing bin/lattis.exe (no rebuild)
    dir: build/windows/nsis
    preconditions:
      - sh: '[ "{{.INSTALL_SCOPE}}" = "user" ] || [ "{{.INSTALL_SCOPE}}" = "machine" ]'
        msg: "INSTALL_SCOPE must be 'user' or 'machine', got '{{.INSTALL_SCOPE}}'"
    cmds:
      # Create the Microsoft WebView2 bootstrapper if it doesn't exist
      - wails3 generate webview2bootstrapper -dir "{{.ROOT_DIR}}/build/windows/nsis"
      - |
        {{if eq OS "windows"}}
        makensis {{if eq .INSTALL_SCOPE "user"}}-DWAILS_INSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user {{end}}{{if .SIGNING}}-DSIGN_SCRIPT="{{.ROOT_DIR}}\build\windows\sign.ps1" {{end}}-DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}\{{.BIN_DIR}}\{{.APP_NAME}}.exe" project.nsi
        {{else}}
        makensis {{if eq .INSTALL_SCOPE "user"}}-DWAILS_INSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user {{end}}-DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" project.nsi
        {{end}}
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      ARG_FLAG: '{{if eq .ARCH "amd64"}}AMD64{{else}}ARM64{{end}}'
      INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'
      SIGNING: '{{if and (ne .SIGN "false") (or (env "WINDOWS_CERT_PATH") (env "WINDOWS_CERT_THUMBPRINT"))}}true{{end}}'

  create:msix:package:
    summary: Creates an MSIX package (signed when a certificate is configured)
    desc: |
      Construit bin/lattis-<version>-<arch>.msix avec build/windows/msix/build-msix.ps1
      (manifeste build/windows/msix/AppxManifest.xml, icônes, association .lattis,
      alias « lattis » en ligne de commande). Signé si WINDOWS_CERT_PATH (+
      WINDOWS_CERT_PASSWORD) ou WINDOWS_CERT_THUMBPRINT est défini, ou avec
      CERT_PATH=... ; PUBLISHER=... impose l'éditeur sans certificat (Azure
      Trusted Signing). Voir docs/release/signature.md.
    deps:
      - task: build
    cmds:
      - task: package:msix
        vars:
          ARCH: '{{.ARCH}}'
          CERT_PATH: '{{.CERT_PATH}}'
          PUBLISHER: '{{.PUBLISHER}}'
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      CERT_PATH: '{{.CERT_PATH | default ""}}'
      PUBLISHER: '{{.PUBLISHER | default ""}}'

  package:msix:
    summary: Creates the MSIX package from the existing bin/lattis.exe (no rebuild)
    cmds:
      - pwsh -NoProfile -ExecutionPolicy Bypass -File "{{.ROOT_DIR}}/build/windows/msix/build-msix.ps1" -Arch {{.ARCH}} {{if .CERT_PATH}}-CertPath "{{.CERT_PATH}}" {{end}}{{if .PUBLISHER}}-Publisher "{{.PUBLISHER}}" {{end}}{{if eq .SIGN "false"}}-NoSign{{end}}
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  install:msix:tools:
    summary: Installs tools required for MSIX packaging
    cmds:
      - wails3 tool msix-install-tools

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'

  sign:
    summary: Signs the Windows executable
    desc: |
      Signe bin/lattis.exe (Authenticode SHA-256, horodaté) avec
      build/windows/sign.ps1 : certificat WINDOWS_CERT_PATH + WINDOWS_CERT_PASSWORD
      (.pfx) ou WINDOWS_CERT_THUMBPRINT (magasin de l'utilisateur, jeton EV).
    deps:
      - task: build
    cmds:
      - task: sign:exe

  sign:exe:
    summary: Signs the existing bin/lattis.exe (no rebuild)
    cmds:
      - pwsh -NoProfile -ExecutionPolicy Bypass -File "{{.ROOT_DIR}}/build/windows/sign.ps1" -Files "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe"

  sign:installer:
    summary: Creates the NSIS installer, signed (installer and uninstaller)
    cmds:
      - task: create:nsis:installer
        vars:
          INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'

  release:
    summary: Builds the signed Windows release (lattis.exe, NSIS installers, MSIX)
    desc: |
      Construit lattis.exe, le signe, puis en fait les deux installeurs NSIS (par
      utilisateur et par machine) et le paquet
      MSIX, signés eux aussi quand un certificat est configuré (sinon : non
      signés, avec un avertissement). Résultats dans bin/.
      SIGN=false force des paquets non signés.
    cmds:
      - task: build
        vars:
          ARCH: '{{.ARCH}}'
      - task: '{{if ne .SIGN "false"}}sign:exe{{else}}release:nosign{{end}}'
      # Deux installeurs : par utilisateur (bin/lattis-<arch>-user-installer.exe,
      # sans droits d'administration) et par machine (bin/lattis-<arch>-installer.exe).
      - task: package:nsis
        vars:
          ARCH: '{{.ARCH}}'
          INSTALL_SCOPE: user
          SIGN: '{{.SIGN}}'
      - task: package:nsis
        vars:
          ARCH: '{{.ARCH}}'
          INSTALL_SCOPE: machine
          SIGN: '{{.SIGN}}'
      - task: package:msix
        vars:
          ARCH: '{{.ARCH}}'
          SIGN: '{{.SIGN}}'
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  release:nosign:
    internal: true
    cmds:
      - 'echo "SIGN=false : paquets Windows non signés"'
