<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
		<title>Lattis</title>
		<style>
			/* Chargement de l'application (avant son code) : retiré par +page.svelte au montage. */
			#boot {
				position: fixed;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 14px;
				background: #fff;
				font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
				color: #217346;
			}
			#boot b {
				font-size: 26px;
				font-weight: 600;
			}
			#boot .bar {
				width: 180px;
				height: 3px;
				border-radius: 2px;
				background: #e3efe7;
				overflow: hidden;
			}
			#boot .bar::before {
				content: '';
				display: block;
				width: 40%;
				height: 100%;
				border-radius: 2px;
				background: #217346;
				animation: boot 1.1s ease-in-out infinite;
			}
			@keyframes boot {
				from {
					transform: translateX(-100%);
				}
				to {
					transform: translateX(250%);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#boot .bar::before {
					animation: none;
					width: 100%;
					opacity: 0.6;
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="boot" role="status" aria-label="Chargement de Lattis"><b>Lattis</b><div class="bar"></div></div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
