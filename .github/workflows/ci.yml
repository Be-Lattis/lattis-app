name: CI

# Tests à chaque push sur main (là où le travail est commité) et sur chaque
# PR, sous Linux et sous Windows : le code propre à Windows (verrou du
# fichier, registre, trousseau, renommage réessayé contre l'antivirus) n'est
# testé que là. Les builds multi-OS et la mesure se lancent à la demande
# (Actions › Run workflow).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un nouveau push annule la CI en cours de la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WAILS_VERSION: v3.0.0-beta.30
  # Essais rédigés en français : la langue du système des machines GitHub (anglais) n'y joue pas.
  LATTIS_SYSTEM_LOCALE: fr-FR

jobs:
  # Les travaux tournent en même temps : la durée de la CI est celle du plus
  # long (objectif : moins de 5 min ; docs/audits/audit-tests-ci-2026-10-30.md).
  go:
    name: Go (tests, ${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux passe tout ; Windows, plus lent (restauration du cache,
          # disque), passe les essais aléatoires et les formats anciens en
          # version courte (-short) : son code propre (verrous, registre,
          # renommage) est couvert pareil.
          - os: ubuntu-24.04
            short: ""
          - os: windows-latest
            short: "-short"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # internal/bridge importe Wails, qui compile contre GTK 4 / WebKitGTK sous Linux
      # (sous Windows, WebView2 ne demande rien à la compilation).
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      # engine et protocol : le moteur web et le contrat de lattisd, testés
      # jusqu'ici par scripts/release.sh seulement.
      - run: go test ${{ matrix.short }} ./internal/... ./engine/... ./protocol/...

  # go vet à part, sous Linux seulement : le code propre à Windows est vérifié
  # par compilation croisée (aucun cgo hors de Wails sous Linux).
  vet:
    name: Go (vet)
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - run: go vet ./internal/... ./engine/... ./protocol/...
      - run: GOOS=windows go vet ./internal/... ./engine/... ./protocol/...

  # Détecteur de courses sur les paquets où plusieurs fils se croisent
  # (suivi en ligne, coédition, base, tâches) ; -short : essais aléatoires
  # en version courte.
  race:
    name: Go (-race, suivi et coédition)
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -short ./internal/coedit/... ./internal/remote/... ./internal/store/... ./internal/work/...

  frontend:
    name: Frontend (svelte-check + vitest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  # Parcours de bout en bout sur la version web (frontend/e2e, Playwright) :
  # moteur web compilé sans cgo, Chrome déjà installé sur le runner. Facultatif
  # tant que la série n'a pas fait ses preuves en CI.
  e2e:
    name: Bout en bout (Playwright, version web)
    runs-on: ubuntu-24.04
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run build:web
      - run: CGO_ENABLED=0 go build -tags web -o "$RUNNER_TEMP/lattis-engine" ../cmd/lattis-engine
      - run: npx playwright test
        env:
          LATTIS_E2E_ENGINE: ${{ runner.temp }}/lattis-engine
          LATTIS_E2E_CHANNEL: chrome
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results

  build:
    name: Build ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dépendances Linux (GTK 4, WebKitGTK 6)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - run: wails3 build
      - uses: actions/upload-artifact@v4
        with:
          name: lattis-${{ runner.os }}
          path: bin/

  # Mesure de la grille sous WebKitGTK (le moteur le plus lent), dans un
  # affichage virtuel : rendu logiciel, donc chiffres pessimistes, mais
  # comparables d'un commit à l'autre. Voir docs/mesures/grille.md.
  bench-linux:
    name: Mesure grille (WebKitGTK)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev xvfb
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - run: wails3 build
      - name: Mesure
        # Le bac à sable de WebKitGTK (bubblewrap) a besoin des espaces de noms
        # utilisateur, restreints par AppArmor sur les runners Ubuntu 24.04.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          export GTK_A11Y=none
          export LATTIS_BENCH="$PWD/bench-webkitgtk.json"
          timeout 600 xvfb-run -a -s "-screen 0 1280x800x24" ./bin/lattis
          cat "$LATTIS_BENCH"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-webkitgtk
          path: bench-webkitgtk.json
